name: Sync WRL Contacts

on:
  schedule:
    - cron: '0 */6 * * *' # Spustí se automaticky každých 6 hodin
  workflow_dispatch:

permissions:
  contents: write # Povolí push zpět do repozitáře

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch QSOs from WRL
        env:
          WRL_API_KEY: ${{ secrets.WRL_API_KEY }}
        run: |
          # -f: selže při HTTP chybě (401, 500…), -sS: tichý, ale vypíše chyby
          curl -fsS -H "Authorization: Bearer $WRL_API_KEY" \
               "https://app.worldradioleague.com/index.php/api/qso" \
               -o qso.json

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add qso.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update QSO data from WRL"
            git push
          fi