<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Radio Amateur Logbook</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0284c7;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #334155;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📻 Můj QSO Logbook</h1>
        <table id="qso-table">
            <thead>
                <tr>
                    <th>Datum / Čas (UTC)</th>
                    <th>Značka (Call)</th>
                    <th>Pásmo</th>
                    <th>Mód</th>
                    <th>RST (S)</th>
                    <th>RST (R)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="loading">Načítám spojení...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadQSOs() {
            try {
                // Načte soubor qso.json, který automaticky stahuje GitHub Action z WRL
                const response = await fetch('qso.json');
                if (!response.ok) throw new Error('Nelze načíst data deníku.');
                
                const data = await response.json();
                const tbody = document.querySelector('#qso-table tbody');
                tbody.innerHTML = '';

                // WRL může vracet data jako pole nebo objekt, ošetříme obě varianty
                const qsos = Array.isArray(data) ? data : (data.result || data.qsos || []);

                if (qsos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">Zatím žádná spojení.</td></tr>';
                    return;
                }

                // Vykreslíme posledních např. 50 spojení
                qsos.slice(0, 50).forEach(qso => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${qso.TIME_ON || qso.time_on || '-'}</td>
                        <td><strong>${qso.CALL || qso.call || '-'}</strong></td>
                        <td>${qso.BAND || qso.band || '-'}</td>
                        <td>${qso.MODE || qso.mode || '-'}</td>
                        <td>${qso.RST_SENT || qso.rst_sent || '-'}</td>
                        <td>${qso.RST_RCVD || qso.rst_rcvd || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                document.querySelector('#qso-table tbody').innerHTML = 
                    '<tr><td colspan="6" class="loading" style="color: #ef4444;">Chyba při načítání dat deníku.</td></tr>';
            }
        }

        loadQSOs();
    </script>
</body>
</html>
