<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Horák.net - Článek</title>
    <link rel="stylesheet" href="styles.css">
    <script src="anketa.js"></script>
    <script src="menu.js"></script>
</head>
<body>

<div class="hlavni-layout">

    <!-- SEM SE AUTOMATICKY VLOŽÍ HORNÍ ČÁST Z MENU.HTML -->
    <div id="slot-horni-cast"></div>

    <!-- HLAVNÍ MŘÍŽKA -->
    <div class="obsahova-mrizka">

        <!-- SEM SE AUTOMATICKY VLOŽÍ LEVÝ PANEL Z MENU.HTML -->
        <div class="levy-panel" id="slot-levy-panel">
            Načítám menu...
        </div>

        <!-- STŘEDNÍ OBSAH (Samotný článek) -->
        <div class="stredni-obsah">
            
            <div class="clanek-text">
                <p>Zde mohete zanechávat vzkazy :P</p>
                <p>Prosíme vás zde <b>nespamovat</b>, že vám systém dovolí sem naházet 100 vzkazů za minutu neznamená že to dělat musíte. Nechci zbytečně dělat nový JS kde by byly i antiblbec opatření TwT</p>
                <hr>
            <form id="f">
            <input id="n" placeholder="Jméno..." required>
            <input id="t" placeholder="Vzkaz..." required>
            <button>Poslat</button>
            </form>

            <div id="seznam">Načítám vzkazy...</div>
            <script src="kniha-h.js"></script>
            </div>

        </div>

    </div>

</div>
</body>
</html>
